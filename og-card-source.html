<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG card source</title>
<!-- Source for /assets/og-card.jpg. Regenerate:
     browse goto <host>/og-card-source.html
     browse screenshot /tmp/og.png --selector "#card"
     sips -s format jpeg -s formatOptions 82 /tmp/og.png --out assets/og-card.jpg -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #808080; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #000000 url('/assets/aurora-moon.jpg') center / cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 80px;
  }

  /* Same even scrim the site uses (D-021), weighted left so the type side
     stays dark while the aurora still reads on the right. */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.28) 62%, rgba(0, 0, 0, 0.18) 100%),
      rgba(0, 0, 0, 0.3);
  }

  .card > * { position: relative; z-index: 1; }

  .name {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 104px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #ffffff;
  }

  .role {
    font-family: 'Raleway', sans-serif;
    font-weight: 400;
    font-size: 38px;
    line-height: 1.3;
    color: #ffffff;
    margin-top: 20px;
  }

  .availability {
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
    font-size: 19px;
    line-height: 1.7;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #e6e6e6;
    max-width: 780px;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <p class="name">Akshat&nbsp;Tiwari</p>
    <p class="role">GTM Engineer</p>
    <p class="availability">Open to remote GTM engineering roles with US companies. Available from November 2026.</p>
  </div>
</body>
</html>
